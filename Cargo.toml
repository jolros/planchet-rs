[workspace]
resolver = "2"
members = [
    "planchet",
    "planchet-cli", "planchet-stresstest",
]

[workspace.dependencies]
anyhow = "1.0.101"
async-trait = "0.1"
clap = { version = "4.5.59", features = ["derive", "env"] }
chrono = { version = "0.4.43", features = ["serde"] }
futures = "0.3.32"
http = "1.4"
iso_currency = { version = "0.5.3", features = ["with-serde"] }
isolang = { version = "2.4", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json"] }
reqwest-middleware = "0.5.1"
rust_decimal = { version = "1.40.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
tabled = "0.20.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = { version = "2.5.8", features = ["serde"] }
assert_cmd = "2.1.2"
predicates = "3.1.4"
mockito = "1.7.2"
planchet = { path = "planchet" }
